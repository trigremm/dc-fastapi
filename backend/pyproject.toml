[project]
name = "dc-fastapi"
version = "0.1.0"
description = "Document Processing API — FastAPI sample with PostgreSQL, Redis, RabbitMQ, MinIO, Gotenberg"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.0",
  "aio-pika>=9.4",
  "boto3>=1.35",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
